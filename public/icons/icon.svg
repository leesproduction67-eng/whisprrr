<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#180b28" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(236,72,153,0.3)" stroke-width="4" />

  <!-- Center Glowing Hologram Orb -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#glowGrad)" stroke-width="12" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="110" fill="rgba(236, 72, 153, 0.08)" />

  <!-- Chat / Soundwave Cyber Logo -->
  <path d="M190 200 C190 160, 322 160, 322 200 C322 245, 275 270, 256 300 C250 310, 240 310, 235 300 C216 270, 190 245, 190 200 Z" fill="url(#glowGrad)" />
  <circle cx="256" cy="350" r="16" fill="#06b6d4" />
  
  <!-- Subtle waveform bars -->
  <rect x="160" y="240" width="8" height="32" rx="4" fill="#ec4899" opacity="0.8" />
  <rect x="344" y="240" width="8" height="32" rx="4" fill="#06b6d4" opacity="0.8" />
</svg>
